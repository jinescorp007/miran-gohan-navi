<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5f">
  <title>ミランごはんナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <h1>ミランごはんナビ</h1>
    <p>メニュー写真から、食べられそうな料理をすばやく確認</p>
  </div>
  <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
</header>

<main>
  <section class="notice">
    <strong>重要：</strong>このアプリは安全を保証しません。外食では原材料・調味料・調理器具や油の共用を、必ず店員さんに確認してください。
  </section>

  <section class="card">
    <h2>1. メニューを撮影</h2>
    <label class="camera-button">
      📷 写真を撮る／画像を選ぶ
      <input id="imageInput" type="file" accept="image/*" capture="environment">
    </label>
    <img id="preview" class="preview hidden" alt="メニュー写真のプレビュー">
    <button id="ocrBtn" class="primary" disabled>文字を読み取る</button>
    <div id="ocrStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>2. 読み取ったメニュー</h2>
    <textarea id="menuText" rows="10" placeholder="写真から読み取った文字がここに表示されます。誤りがあれば修正してください。"></textarea>
    <button id="analyzeBtn" class="primary">食べられそうな料理を判定</button>
  </section>

  <section id="resultSection" class="card hidden">
    <h2>3. 判定結果</h2>
    <div class="legend">
      <span class="green">候補</span>
      <span class="yellow">要確認</span>
      <span class="red">避ける</span>
      <span class="gray">情報不足</span>
    </div>
    <div id="results"></div>
  </section>

  <section class="card">
    <h2>店員さんに見せる</h2>
    <div id="staffMessage" class="staff-message"></div>
    <button id="copyMessageBtn">文章をコピー</button>
  </section>

  <section class="card">
    <h2>食事・症状メモ</h2>
    <input id="mealName" placeholder="食べた料理">
    <textarea id="symptomNote" rows="3" placeholder="食べた量、時刻、症状など"></textarea>
    <button id="saveLogBtn">記録を保存</button>
    <div id="logs"></div>
  </section>
</main>

<dialog id="settingsDialog">
  <form method="dialog" class="dialog-form">
    <div class="dialog-title">
      <h2>アレルギー設定</h2>
      <button value="cancel" class="icon-btn">✕</button>
    </div>
    <p class="small">医師から指示された除去食品だけを「避ける」にしてください。血液検査の陽性だけで自動的に除去しないでください。</p>
    <div id="allergenSettings"></div>
    <label>その他の避ける食品
      <input id="customAvoid" placeholder="例：くるみ、えび">
    </label>
    <button id="saveSettingsBtn" value="default" class="primary">保存</button>
  </form>
</dialog>

<footer>
  緊急時：息苦しさ、顔や舌の腫れ、繰り返す嘔吐、ぐったりがあれば119番
</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
