<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5f">
<title>ミランごはんナビ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><h1>ミランごはんナビ</h1><p>安心を育てる食事カルテ</p></div><button id="settingsBtn">⚙️</button></header>
<main>
<section class="notice"><b>重要：</b>このアプリは安全を保証・診断しません。外食や加工食品は、原材料・調味料・揚げ油・調理器具の共用を店舗や学校へ確認してください。</section>

<section class="card urgent">
<h2>今すぐ食べるものを決める</h2>
<div class="grid4">
<button data-meal="朝">朝ごはん</button><button data-meal="昼">昼ごはん</button>
<button data-meal="夜">夕ごはん</button><button data-meal="おやつ">おやつ</button>
</div>
<button id="nothingBtn" class="primary">食べるものがない時の候補</button>
<div id="mealSuggestions"></div>
</section>

<section class="card">
<div class="title-row"><h2>食べられたものリスト</h2><button id="addFoodBtn">＋追加</button></div>
<p class="small">食品名ではなく、商品・料理・調理法ごとに登録します。</p>
<div id="safeList"></div>
</section>

<section class="card">
<h2>メニュー写真を確認</h2>
<label class="camera">📷 写真を撮る／選ぶ<input id="imageInput" type="file" accept="image/*" capture="environment"></label>
<img id="preview" hidden>
<button id="ocrBtn" class="primary" disabled>文字を読み取る</button>
<div id="status" class="small"></div>
<textarea id="menuText" rows="8" placeholder="読み取った文字。誤りがあれば修正してください。"></textarea>
<button id="judgeBtn" class="primary">アレルギー設定と照合</button>
<div id="results"></div>
</section>

<section class="card">
<h2>今日の食事・症状記録</h2>
<input id="mealName" placeholder="食べた料理・商品・店名">
<div class="grid2">
<select id="symptom">
<option value="症状なし">症状なし</option>
<option value="少しかゆい">少しかゆい</option>
<option value="発疹">発疹</option>
<option value="腹痛・嘔吐">腹痛・嘔吐</option>
<option value="呼吸症状">呼吸症状</option>
<option value="救急受診">救急受診</option>
</select>
<select id="activity">
<option value="運動なし">運動なし</option>
<option value="軽い運動">軽い運動</option>
<option value="1〜2時間の運動">1〜2時間の運動</option>
<option value="3時間以上の激しい運動">3時間以上の激しい運動</option>
</select>
</div>
<textarea id="note" rows="3" placeholder="食べた量、時刻、発症時刻、薬など"></textarea>
<button id="saveLogBtn">記録を保存</button>
<div id="logs"></div>
</section>
</main>

<dialog id="foodDialog"><form method="dialog" class="dialog">
<div class="title-row"><h2>食べられたものを追加</h2><button value="cancel">✕</button></div>
<input id="foodName" placeholder="例：炊いた白ご飯">
<select id="foodCategory"><option>主食</option><option>主菜</option><option>副菜</option><option>果物</option><option>おやつ</option><option>その他</option></select>
<input id="foodDetail" placeholder="量・調理法・商品名">
<input id="foodDate" type="date">
<textarea id="foodMemo" rows="3" placeholder="症状なし、店員確認済み等"></textarea>
<button id="saveFoodBtn" class="primary" value="default">保存</button>
</form></dialog>

<dialog id="settingsDialog"><form method="dialog" class="dialog">
<div class="title-row"><h2>アレルギー設定</h2><button value="cancel">✕</button></div>
<p class="small">検査結果と実際に食べられるかは別管理です。医師の指示に合わせて変更してください。</p>
<div id="settings"></div>
<button id="saveSettingsBtn" class="primary" value="default">保存</button>
</form></dialog>

<footer>息苦しさ、顔・舌の腫れ、繰り返す嘔吐、ぐったりがあれば119番。</footer>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body></html>
